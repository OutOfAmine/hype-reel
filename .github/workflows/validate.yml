name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Scripts parse
        run: for f in scripts/*.mjs; do node --check "$f"; done
      - name: Every example builds
        run: for j in examples/*/reel.json; do python scripts/build.py "$j"; done
